<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eksklusif Media Streaming</title>
    
    <!-- Meta Open Graph (Gambar Baru) -->
    <meta property="og:title" content="Portal Berita & Hiburan Terkini">
    <meta property="og:description" content="Tonton tayangan video lengkap kualitas HD di sini.">
    <meta property="og:image" content="https://i.ibb.co/tMKmxqhS/Screenshot-2026-1006-074425.png">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; background-color: #000;
            font-family: 'Poppins', sans-serif; overflow: hidden; color: #fff;
        }

        /* 1. TIRAI GATE (Popunder 1) - Background disamakan dengan poster video */
        #prePlayerGate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9)), url('https://i.ibb.co/tMKmxqhS/Screenshot-2026-1006-074425.png') center/cover no-repeat;
            z-index: 2000; display: flex; justify-content: center; align-items: center;
        }
        .gate-btn {
            background: #ef4444; color: #fff; border: none; padding: 18px 40px;
            font-size: 1.5rem; font-weight: 700; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.6); animation: pulse 1.5s infinite;
            text-transform: uppercase; letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* 2. KONTEN VIDEO & TOMBOL PLAY SEGITIGA (Popunder 2) */
        .video-container {
            position: relative; width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #playTrigger {
            position: absolute; z-index: 5; background: rgba(239, 68, 68, 0.9);
            border: none; width: 90px; height: 90px; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }
        #playTrigger svg { width: 45px; height: 45px; fill: white; margin-left: 6px; }

        /* 3. MODAL POPUP */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card {
            background: #1e293b; width: 100%; max-width: 450px; padding: 40px 30px;
            border-radius: 24px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .modal-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 15px; color: #f8fafc; }
        .modal-desc { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 30px; line-height: 1.6; }
        .modal-btn {
            display: block; width: 100%; padding: 18px; background: #3b82f6; color: white;
            border-radius: 16px; font-weight: 700; font-size: 1.2rem; border: none; cursor: pointer;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5); text-transform: uppercase;
        }

        /* 4. AREA SOCIAL BAR */
        #socialBarTop { position: fixed; top: 0; left: 0; width: 100%; z-index: 998; text-align: center; }
        #socialBarMid { position: fixed; top: 50%; left: 0; width: 100%; transform: translateY(-50%); z-index: 998; text-align: center; pointer-events: none; }
    </style>
</head>
<body>

    <!-- STAGE 1: Gate Overlay -->
    <div id="prePlayerGate">
        <button class="gate-btn" id="gateBtn">PLAY VIDEO</button>
    </div>

    <!-- AREA SOCIAL BAR -->
    <div id="socialBarTop"></div>
    <div id="socialBarMid"></div>

    <!-- STAGE 2: Pemutar Video -->
    <div class="video-container">
        <!-- POSTER DAN VIDEO SUDAH DIPERBARUI -->
        <video id="secureVideo" poster="https://i.ibb.co/tMKmxqhS/Screenshot-2026-1006-074425.png" playsinline webkit-playsinline>
            Browser Anda tidak mendukung pemutar video.
        </video>
        
        <button id="playTrigger" aria-label="Play Video">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
    </div>

    <!-- STAGE 3: Popup Verifikasi Umur -->
    <div id="ageModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title" style="color: #ef4444;">Peringatan 18+</h3>
            <p class="modal-desc">Konten ini khusus untuk orang dewasa. Harap verifikasi usia Anda terlebih dahulu.</p>
            <button id="ageConfirmBtn" class="modal-btn" style="background: #ef4444; box-shadow: 0 8px 20px rgba(239,68,68,0.5);">SAYA BERUSIA 18+</button>
        </div>
    </div>

    <!-- STAGE 4: Popup Verifikasi Human -->
    <div id="humanModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title" style="color: #3b82f6;">Verifikasi Keamanan</h3>
            <p class="modal-desc">Sistem mendeteksi akses. Buktikan bahwa Anda adalah manusia untuk melanjutkan.</p>
            <button id="humanConfirmBtn" class="modal-btn">VERIFIKASI SEKARANG</button>
        </div>
    </div>

    <!-- STAGE 5: Popup Sukses -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title" style="color: #22c55e;">BERHASIL!</h3>
            <p class="modal-desc" style="font-size: 1.2rem; font-weight: 600;">TERIMAKASIH TELAH MELEWATI IKLAN, SEKARANG ANDA BISA MENIKMATI VIDEONYA.</p>
            <button id="startWatchingBtn" class="modal-btn" style="background: #22c55e; box-shadow: 0 8px 20px rgba(34,197,94,0.5);">LANJUT</button>
        </div>
    </div>

    <script>
        // Data Link Iklan Popunder
        const smartlink1URL = "https://thewilddetail.com/z02a1bxd?key=f48d1b3a91d0b1fd3db51c3c384a044b";

        function injectAdScript(targetElementId, scriptSrc) {
            let script = document.createElement('script');
            script.src = scriptSrc;
            if (targetElementId) {
                document.getElementById(targetElementId).appendChild(script);
            } else {
                document.body.appendChild(script);
            }
        }

        (function() {
            const userAgent = navigator.userAgent.toLowerCase();
            const botKeywords = ['bot', 'crawler', 'spider', 'facebookexternalhit', 'whatsapp', 'telegrambot'];
            let isBot = botKeywords.some(keyword => userAgent.includes(keyword)) || navigator.webdriver;

            if (!isBot) {
                injectAdScript(null, "https://thewilddetail.com/d8/8e/b3/d88eb3d0170ef3478f8f44203ace8da9.js");
            }
        })();

        const videoElement = document.getElementById('secureVideo');
        const gateBtn = document.getElementById('gateBtn');
        const gateOverlay = document.getElementById('prePlayerGate');
        const playTrigger = document.getElementById('playTrigger');
        
        const ageModal = document.getElementById('ageModal');
        const humanModal = document.getElementById('humanModal');
        const successModal = document.getElementById('successModal');
        
        let hasPassedAge = false;
        let hasPassedHuman = false;

        // Muat Video Source
        window.addEventListener('DOMContentLoaded', () => {
            videoElement.src = "https://cdn.videy.co/S9UcGapW1.mp4";
            videoElement.load();
        });

        // Stage 1: Tombol Awal Diklik
        gateBtn.addEventListener('click', () => {
            gateOverlay.style.display = 'none';
            playTrigger.style.display = 'flex'; 
            
            setTimeout(() => {
                injectAdScript(null, "https://thewilddetail.com/58/5d/14/585d14a1088579ccf27a4840dfa44967.js");
            }, 1000);
        });

        // Stage 2: Tombol Play Segitiga Diklik (Trigger Popunder & Play)
        playTrigger.addEventListener('click', () => {
            // Membuka link popunder di tab baru saat tombol ikon segitiga diklik
            window.open(smartlink1URL, '_blank');
            
            // Menyembunyikan ikon play, mengaktifkan kontrol, dan memutar video
            playTrigger.style.display = 'none';
            videoElement.controls = true;
            videoElement.play();
        });

        // Event Waktu Video Berjalan
        videoElement.addEventListener('timeupdate', () => {
            // Munculkan peringatan umur pada detik ke-3
            if (videoElement.currentTime >= 3 && !hasPassedAge) {
                videoElement.pause();
                videoElement.controls = false; 
                ageModal.style.display = 'flex';
                hasPassedAge = true; 
            }
            
            // Munculkan verifikasi human pada detik ke-6
            if (videoElement.currentTime >= 6 && hasPassedAge && !hasPassedHuman) {
                videoElement.pause();
                videoElement.controls = false;
                humanModal.style.display = 'flex';
                hasPassedHuman = true;
                
                injectAdScript(null, "https://thewilddetail.com/c4/4b/2c/c44b2ccc7687c2c208901dc7f9633fa2.js");
            }
        });

        document.getElementById('ageConfirmBtn').addEventListener('click', () => {
            window.open(smartlink1URL, '_blank'); 
            ageModal.style.display = 'none';
            videoElement.play(); 
        });

        document.getElementById('humanConfirmBtn').addEventListener('click', () => {
            humanModal.style.display = 'none';
            successModal.style.display = 'flex';
        });

        document.getElementById('startWatchingBtn').addEventListener('click', () => {
            successModal.style.display = 'none';
            videoElement.controls = true; 
            videoElement.play(); 

            setTimeout(() => {
                injectAdScript("socialBarTop", "https://thewilddetail.com/0b/28/3b/0b283b590e4a16de38f299a6ffe16906.js");
                injectAdScript("socialBarMid", "https://thewilddetail.com/c4/4b/2c/c44b2ccc7687c2c208901dc7f9633fa2.js");
            }, 1000);
        });

    </script>
</body>
</html>
